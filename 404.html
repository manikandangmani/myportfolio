<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Oops! This page has drifted off into the void. Return to Manikandan G Mani's portfolio.">
  <title>404: Lost in Space | Manikandan G Mani</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2338bdf8'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial Black' font-weight='900' font-size='18' fill='%23020617'>M</text></svg>">

  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="global.css">

  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .error-container {
      padding: 0 8%;
      animation: fadeUp 1s ease both;
    }

    .glitch-404 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(80px, 15vw, 180px);
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      position: relative;
      margin-bottom: 24px;
      letter-spacing: -5px;
    }

    .glitch-404::before,
    .glitch-404::after {
      content: '404';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.8;
    }

    .glitch-404::before {
      color: var(--accent2);
      z-index: -1;
      animation: glitch 3s cubic-bezier(.25, .46, .45, .94) both infinite;
    }

    .glitch-404::after {
      color: #ff00c1;
      z-index: -2;
      animation: glitch 3s cubic-bezier(.25, .46, .45, .94) reverse both infinite;
    }

    @keyframes glitch {
      0% {
        transform: translate(0);
      }

      20% {
        transform: translate(-3px, 3px);
      }

      40% {
        transform: translate(-3px, -3px);
      }

      60% {
        transform: translate(3px, 3px);
      }

      80% {
        transform: translate(3px, -3px);
      }

      100% {
        transform: translate(0);
      }
    }

    .error-msg {
      color: var(--muted);
      font-size: 18px;
      max-width: 500px;
      margin: 0 auto 40px;
      line-height: 1.6;
    }

    .btn.primary {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 32px;
      border-radius: 50px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
      transition: var(--trans);
    }

    .btn.primary:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px var(--glow);
    }

    .theme-float {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 1000;
      animation: fadeUp .8s ease both .1s;
    }
  </style>
</head>

<body>

  <div class="page-transition-overlay" id="pageTransition"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="theme-float">
    <button id="themeToggle" class="toggle-btn" aria-label="Toggle theme">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <div class="error-container">
    <div class="glitch-404">404</div>
    <p class="error-msg">The page you're looking for has drifted off into the digital void. Don't worry, we can guide
      you back home.</p>
    <a href="index.html" onclick="history.back(); return false;" class="btn primary">
      <i class="fas fa-home"></i> Return to Earth
    </a>
  </div>

  <script src="main.js" defer></script>
  <script>
    /* Theme Toggle Sync */
    const toggle = document.getElementById('themeToggle');
    if (toggle) {
      const tIcon = toggle.querySelector('i');
      if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light');
        if (tIcon) tIcon.className = 'fas fa-sun';
      }
      toggle.onclick = () => {
        const isLight = document.body.classList.toggle('light');
        if (tIcon) tIcon.className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
      };
    }
  </script>
</body>

</html>
